name: 问题反馈（附日志）
description: 功能未执行、结果异常、掉线等问题，请附日志帮助定位。
body:
  - type: markdown
    attributes:
      value: |
        请先保留问题发生时的日志，不要先删除 data 目录或重新部署。
        “已跳过”“等待确认”“材料扣款尚未确认”并不表示执行成功，请附上前后文。
        自己进入游戏前请先暂停托管，退出游戏后恢复托管。工具会自动同步当前工厂、农田和库存，再按设置继续规划。
        挂机中同步读取失败会暂缓经营操作并自动重试。尚未开始挂机时，在后续页面读取或开始挂机时重试。已有相同问题的 issue 时，可直接到原帖补充日志。
  - type: textarea
    id: behavior
    attributes:
      label: 问题现象与复现步骤
      description: 写明开启的功能、操作步骤、预期结果和实际结果。工厂/农田请写建筑和产品，以及是否手动生产、收成品或改种和恢复托管后自动同步的结果；海兽请写驻扎建筑及目标，舰队问题请写编号。
      placeholder: |
        1. 开启了……
        2. 等待……后，日志显示……
        预期：……
        实际：……
    validations:
      required: true
  - type: input
    id: occurred_at
    attributes:
      label: 发生时间（北京时间）
      placeholder: 2026-11-16 22:43 左右
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与启动方式
      description: 可运行 git rev-parse --short HEAD 和 node -v；无法获取时请写下载日期或来源。
      placeholder: |
        工具版本/提交号：
        Node.js 版本：
        启动方式（npm start / start-console.cmd / 其他）：
        游戏渠道（微信/抖音）：
    validations:
      required: true
  - type: dropdown
    id: concurrent_login
    attributes:
      label: 问题发生前后是否在游戏客户端登录了同一账号？
      options:
        - 没有同时上号
        - 上号前已暂停托管
        - 上号时没有暂停托管
        - 不确定
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 相关设置
      description: 附上挂机模块开关、对应详细配置截图；掉线/顶号问题请附登录设置。请遮去不相关个人信息。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 诊断日志（可上传 ZIP）
      description: |
        复现后及时复制数据目录中的 protocol.log 和 protocol.log.1（如有），压缩后拖入此处。
        默认目录是项目的 data/；设置了 CW_DATA_DIR 时使用该目录。日志轮转可能覆盖旧内容，请包含发生时间前后记录。
        登录凭据写入前会脱敏。不要上传整个 data/、accounts.json、账号导出文件或登录凭据。
        若无法取得日志，请说明原因；仅截图通常无法定位请求和回包问题。
      placeholder: 在此拖入日志或 ZIP，也可说明无法提供日志的原因。
    validations:
      required: true
